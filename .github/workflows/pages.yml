name: Forskoðun á GitHub Pages

on:
  push:
    branches: [claude/kind-goldberg-2sd4h8]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stilla Pages (kveikir a theim ef slokkt)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Pakka sidunni
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Birta
        id: deployment
        uses: actions/deploy-pages@v4
