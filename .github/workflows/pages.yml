name: Forskodun a GitHub Pages

on:
  push:
    branches: [claude/kind-goldberg-2sd4h8]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages verdur ad vera kveikt handvirkt einu sinni:
      # Settings -> Pages -> Source: GitHub Actions
      - name: Athuga hvort kveikt se a Pages
        id: check
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages er ekki kveikt. Farðu i Settings -> Pages og veldu Source: GitHub Actions. Their eftir birtist sidan sjalfkrafa."
          fi

      - name: Stilla Pages
        if: steps.check.outputs.on == 'true'
        uses: actions/configure-pages@v5

      - name: Pakka sidunni
        if: steps.check.outputs.on == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Birta
        id: deployment
        if: steps.check.outputs.on == 'true'
        uses: actions/deploy-pages@v4
