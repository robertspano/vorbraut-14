<meta charset="utf-8">
<title>kickprobe</title>
<iframe id="f" src="/hafa-samband.html" style="width:1280px;height:900px;border:0"></iframe>
<pre id="out">pending</pre>
<script>
function lum(c){var m=c.match(/\d+(\.\d+)?/g).map(Number);var a=m.slice(0,3).map(function(v){v=v/255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2]}
function ratio(a,b){var l1=lum(a),l2=lum(b);var hi=Math.max(l1,l2),lo=Math.min(l1,l2);return ((hi+0.05)/(lo+0.05)).toFixed(3)}
setTimeout(function(){
  try{
    var d=document.getElementById('f').contentDocument;
    var k=d.querySelector('.kicker');
    var cs=getComputedStyle(k);
    var bgEl=k, bg='rgba(0, 0, 0, 0)';
    while(bgEl){ var b=getComputedStyle(bgEl).backgroundColor; if(b && b!=='rgba(0, 0, 0, 0)' && b!=='transparent'){bg=b;break} bgEl=bgEl.parentElement }
    var r=k.getBoundingClientRect();
    var out={
      text:k.textContent,
      classes:k.className,
      color:cs.color,
      fontSize:cs.fontSize,
      fontWeight:cs.fontWeight,
      opacity:cs.opacity,
      bgSource:bgEl?bgEl.tagName+'.'+bgEl.className:'none',
      bg:bg,
      contrast:ratio(cs.color,bg),
      rect:[r.x,r.y,r.width,r.height],
      title_color:getComputedStyle(d.querySelector('.kontakt__title')).color,
      lead_color:getComputedStyle(d.querySelector('.kontakt__lead')).color,
      label_color:getComputedStyle(d.querySelector('.cform__field label')).color,
      directlabel_color:getComputedStyle(d.querySelector('.kontakt__directlabel')).color
    };
    out.contrast_label=ratio(out.label_color,bg);
    out.contrast_directlabel=ratio(out.directlabel_color,bg);
    out.contrast_lead=ratio(out.lead_color,bg);
    document.getElementById('out').textContent=JSON.stringify(out,null,1);
  }catch(e){document.getElementById('out').textContent='ERR '+e}
},4000);
</script>
