<!doctype html><meta charset="utf-8"><title>g</title>
<style>pre{font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;padding:10px}</style>
<pre id="ut">bíð…</pre>
<iframe id="f" src="/index.html" style="width:1440px;height:900px"></iframe>
<script>
document.getElementById('f').onload=()=>{const d=document.getElementById('f').contentDocument,w=document.getElementById('f').contentWindow;
 const W=ms=>new Promise(r=>setTimeout(r,ms));
 (async()=>{ const ut={};
  await W(2600);
  const poly=id=>d.querySelector('#facadeSvg polygon[data-id="'+id+'"]');
  const dg=()=>d.querySelector('#selDiagram');
  const ev=(el,t)=>el.dispatchEvent(new w.MouseEvent(t,{bubbles:true}));
  // 1) sveim innan sömu hæðar: EKKERT endursmíðað (sami DOM-hnútur lifir)
  ev(poly('0401'),'mouseenter');  // 4. hæð -> teiknar 4. hæð (hæðarskipti, rAF)
  await W(120);
  const fyrsti=dg().querySelector('.dg-apt');
  ev(poly('0401'),'mouseleave'); ev(poly('0402'),'mouseenter'); // sama hæð
  await W(120);
  ut.samiHnutur=fyrsti===dg().querySelector('.dg-apt');
  ut.merking=[...dg().querySelectorAll('.dg-apt.is-sel')].map(g=>g.dataset.id);
  // 2) stormur: 200 enter/leave víxl innan sömu hæðar — heildartími
  const t0=performance.now();
  for(let i=0;i<100;i++){ ev(poly('0402'),'mouseleave'); ev(poly('0401'),'mouseenter');
                          ev(poly('0401'),'mouseleave'); ev(poly('0402'),'mouseenter'); }
  ut.stormur400vixl_ms=Math.round(performance.now()-t0);
  // 3) hæðarskipti með sveimi virka enn
  ev(poly('0402'),'mouseleave'); ev(poly('0101'),'mouseenter');
  await W(120);
  ut.haedFylgirSveimi=!!dg().querySelector('.dg-apt[data-id="0101"]');
  // 4) keila: over með ÓBREYTT hnit skiptir ekki; move með ný hnit skiptir
  const cone=dg().querySelector('.dg-cone[data-side="framan"]');
  const r=cone.getBoundingClientRect(), cx=r.x+r.width/2, cy=r.y+r.height/2;
  const fyrir=d.querySelector('.facade__img.is-on').dataset.view;
  const mv=(t,x,y)=>cone.dispatchEvent(new w.MouseEvent(t,{bubbles:true,clientX:x,clientY:y}));
  mv('mouseover',cx,cy); mv('mouseover',cx,cy);   // sömu hnit tvisvar = skrun-hermun... fyrsta parið er þó "nýtt"
  await W(80);
  ut.keilaEftirSomuHnit=d.querySelector('.facade__img.is-on').dataset.view;
  mv('mousemove',cx+3,cy+2);                       // raunveruleg hreyfing
  await W(400);
  ut.keilaEftirHreyfingu=d.querySelector('.facade__img.is-on').dataset.view;
  ut.byrjadiA=fyrir;
  // 5) nav transition
  ut.navTransition=w.getComputedStyle(d.querySelector('.nav')).transitionProperty;
  // 6) val virkar enn
  ev(poly('0201'),'mouseenter'); poly('0201').dispatchEvent(new w.MouseEvent('click',{bubbles:true}));
  await W(700);
  ut.valVirkar={titill:d.querySelector('#avTitle').textContent,
                iSel:[...dg().querySelectorAll('.dg-apt.is-sel')].map(g=>g.dataset.id)};
  document.getElementById('ut').textContent=JSON.stringify(ut,null,1);
 })();};
</script>
