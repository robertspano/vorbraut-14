<meta charset="utf-8">
<title>probe</title>
<style>html,body{margin:0}iframe{width:390px;height:800px;border:0}</style>
<pre id="out">running…</pre>
<iframe id="f" src="/index.html"></iframe>
<script>
const out = document.getElementById('out');
const lines = [];
function log(s){ lines.push(s); out.textContent = lines.join('\n'); }
function probe(label){
  const d = document.getElementById('f').contentDocument;
  const w = document.getElementById('f').contentWindow;
  const nav = d.getElementById('nav');
  const cs = w.getComputedStyle(nav);
  log(label + ' | innerWidth=' + w.innerWidth
      + ' | bodyClass="' + d.body.className + '"'
      + ' | navClass="' + nav.className + '"'
      + ' | scrollY=' + w.scrollY
      + ' | background-image=' + cs.backgroundImage
      + ' | background-color=' + cs.backgroundColor
      + ' | logoColor=' + w.getComputedStyle(d.querySelector('.nav__logo')).color);
}
window.addEventListener('load', () => {
  const f = document.getElementById('f');
  setTimeout(() => {
    probe('CURRENT (HEAD)');
    // swap to the pre-commit stylesheet
    const d = f.contentDocument;
    const link = [...d.querySelectorAll('link[rel=stylesheet]')].find(l => /styles\.css/.test(l.getAttribute('href')));
    log('swapping ' + link.getAttribute('href') + ' -> /_old.css');
    link.setAttribute('href', '/_old.css');
    setTimeout(() => { probe('OLD (HEAD~1)'); }, 2500);
  }, 3000);
});
</script>
