  <main class="kontakt" id="hafa-samband">
    <div class="kontakt__inner">
      <div class="kontakt__intro">
        <p class="kicker" data-i18n="ct.kicker">Hafa samband</p>
        <h1 class="kontakt__title" data-i18n="ct.title">Sendu fyrirspurn</h1>
        <p class="kontakt__ibud" id="ctIbud" hidden></p>
        <p class="kontakt__lead" data-i18n="ct.body"></p>
        <div class="kontakt__direct">
          <span class="kontakt__directlabel" data-i18n="ct.orDirect">Eða hafðu beint samband</span>
          <a href="mailto:miklaborg@miklaborg.is" data-i18n="foot.email">miklaborg@miklaborg.is</a>
          <a href="tel:+3545697000" data-i18n="foot.phone">S: 569 7000</a>
        </div>
      </div>
      <div class="kontakt__card">
        <form class="cform" id="contactForm">
          <div class="cform__field">
            <label for="cf-name" data-i18n="ct.fName">Nafn</label>
            <input type="text" id="cf-name" name="name" autocomplete="name" required />
          </div>
          <div class="cform__row">
            <div class="cform__field">
              <label for="cf-email" data-i18n="ct.fEmail">Netfang</label>
              <input type="email" id="cf-email" name="email" autocomplete="email" required />
            </div>
            <div class="cform__field">
              <label for="cf-phone" data-i18n="ct.fPhone">Símanúmer</label>
              <input type="tel" id="cf-phone" name="phone" autocomplete="tel" />
            </div>
          </div>
          <div class="cform__field">
            <label for="cf-message" data-i18n="ct.fMessage">Skilaboð</label>
            <textarea id="cf-message" name="message" rows="4" required></textarea>
          </div>
          <div class="cform__hp" aria-hidden="true">
            <label for="cf-web">Vefsíða</label>
            <input type="text" id="cf-web" name="vefsida" tabindex="-1" autocomplete="off" />
          </div>
          <button type="submit" class="cform__submit" data-i18n="ct.fSubmit">Senda fyrirspurn</button>
          <p class="cform__note" id="cformNote" role="status" aria-live="polite" hidden></p>
        </form>
      </div>
    </div>
  </main>
